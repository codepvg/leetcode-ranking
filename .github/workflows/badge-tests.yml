name: Badge Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/js/user/badges.js"
      - "tests/badges.test.cjs"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/badges.test.cjs
